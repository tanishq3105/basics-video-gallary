<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Gallary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <h1>Video Gallary</h1>
      <div id="videos">
        <script>
          const videoSection = document.getElementById("videos");
          fetch("https://api.freeapi.app/api/v1/public/youtube/videos", {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
            },
          }).then(async (response) => {
            const data = await response.json();
            const videos = data.data.data;
            console.log(videos);
            videos.map((video) => {
              console.log(video);
              const div = document.createElement("div");
              div.id = "video";
              const videoTitle = document.createElement("h3");
              const channelName = document.createElement("h4");
              const description = document.createElement("p");
              const thumbnailUrl = document.createElement("img");
              const tags = document.createElement("p");
              const publishedAt = document.createElement("p");

              videoTitle.innerText = video.items.snippet.title;
              channelName.innerText = video.items.snippet.channelTitle;
              description.innerText =
                video.items.snippet.description.slice(0, 100) + "....";
              thumbnailUrl.src = video.items.snippet.thumbnails.high.url;
              publishedAt.innerText = video.items.snippet.publishedAt;

              const tagsArray = video.items.snippet.tags || [];

              tagsArray.map((tag) => {
                const p = document.createElement("p");
                p.innerText = tag;
                tags.appendChild(p);
              });

              div.append(
                thumbnailUrl,
                videoTitle,
                channelName,
                description,
                publishedAt,
                tags,
              );

              videoSection.appendChild(div);
            });
          });
        </script>
      </div>
    </section>
  </body>
</html>
